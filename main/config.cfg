# =================================================================
# MAP SERVER BOOST ASIO 1.55.0 - CON SISTEMA FAILOVER
# Compatible 100% con cliente TCP original (main.cpp)
# =================================================================

# Puerto principal para comandos ORDER/RESULT/CLIENT_READY
SERVER_PORT=7776

# Puerto exclusivo para transferencia de archivos .cfg
FILE_TRANSFER_PORT=7775

# IP del servidor
SERVER_IP=0.0.0.0

# Número máximo de clientes conectados simultáneamente
MAX_CLIENTS=100

# Tiempo máximo sin actividad antes de considerar cliente zombie
CLIENT_TIMEOUT_MS=300000

# Frecuencia de verificación de clientes zombies
ZOMBIE_CHECK_INTERVAL_MS=30000

# Directorio donde se guardan los archivos .cfg
CFG_OUTPUT_DIR=C:/PVPGN/mapcfgs/

# Directorio raiz para archivos de control y comunicacion (.txt)
TXT_DIRECTORY=C:/PVPGN/main/logs/

# Directorio donde se escanean los mapas disponibles (.w3x, .w3m)
MAP_SCAN_DIRECTORY=C:/xampp/htdocs/UPMAPS/Maps/

# Intervalo de escaneo periódico de mapas (en milisegundos)
# Mínimo: 5000ms (5 segundos), Recomendado: 10000ms (10 segundos)
MAP_SCAN_INTERVAL_MS=10000

# Activar logs detallados
DEBUG_MODE=true

# =================================================================
# SISTEMA DE UPLOAD DE MAPAS (/upload)
# =================================================================

# Puerto dedicado para transferencia de mapas .w3x/.w3m
MAP_UPLOAD_PORT=7774

# Velocidad total destinada para uploads de mapas (en Mbps)
# Ejemplo: si tienes 890 Mbps de subida y quieres usar 50% -> poner 445
MAP_UPLOAD_BANDWIDTH_MBPS=100

# Maximo de uploads simultaneos permitidos
MAP_UPLOAD_MAX_CONCURRENT=3

# Sobreescribir mapa si ya existe en el directorio (true/false)
MAP_UPLOAD_OVERWRITE=true

# Timeout maximo por transferencia en segundos (120 = 2 minutos)
MAP_UPLOAD_TIMEOUT_SECONDS=120

# Tamano maximo de mapa en MB - PROTECCION ANTI-DoS del servidor C++
# NO es limitacion para usuarios (Lua tiene su propio limite menor)
# Solo evita que clientes maliciosos envien tamanos absurdos
MAP_UPLOAD_MAX_SIZE_MB=300

# =================================================================
# IPC SERVER (TCP localhost) - Comunicacion con PvPGN
# =================================================================

IPC_ENABLED=true
IPC_PORT=7772
IPC_BIND_IP=127.0.0.1