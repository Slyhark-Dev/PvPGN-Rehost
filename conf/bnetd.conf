##############################################################################

###############################################################################
# salida textual de escalera war3                                            #
#-----------------------------------------------------------------------------#
# esto es para todos los que quieren escalera de Warcraft 3, pero no quieren que su
# servidor ejecute con soporte MySQL.
# Para cada escalera (solo, equipo, ffa, at) se crea un archivo correspondiente,
# así que es fácil construir tus páginas de escalera con ellos

# el siguiente valor determina, a qué velocidad, estos archivos se crean
# establece en 0 si no quieres o necesitas estos archivos
war3_ladder_update_secs = 300

# la última escalera de jfro está basada en XML... así que podemos cambiar a salida XML de escalera
# a demanda. Tal vez deberíamos establecer el intervalo de actualización más grande porque la versión de salida XML
# es mucho más verbosa que la salida estándar
XML_output_ladder = false

###############################################################################
# salida textual de estado del servidor                                      #
#-----------------------------------------------------------------------------#
# Esto es para escribir estado del servidor en un intento de ver número de usuario
# en línea actualmente, y juegos/canales.
# Esto se almacena en archivo var\status\warcraft3.dat como formato *.ini.
# No debería ser tan difícil en php crear sitio web dinámico usando este contenido.

# el siguiente valor determina, a qué velocidad, estos archivos se crean
# establece en 0 si no quieres o necesitas estos archivos
output_update_secs = 60

# la última escalera de jfro está basada en XML... así que podemos cambiar a salida XML de escalera
# a demanda. Tal vez deberíamos establecer el intervalo de actualización más grande porque la versión de salida XML
# es mucho más verbosa que la salida estándar
XML_status_output = false

###############################################################################
# configuración de clan                                                      #
#-----------------------------------------------------------------------------#

# Tiempo en horas para que un nuevo miembro de clan sea un novato (icono Peon, no puede promocionar a Grunt)
# valor predeterminado 168(7 días). Si se establece en 0, todos los nuevos miembros podrían promocionarse sin tiempo
clan_newer_time = 0

# conteo máximo de miembros permitido en un clan, establece entre 10 y 100, predeterminado 50.
clan_max_members = 50

# Estado predeterminado del canal de clan al crear un clan, 1 para privado, 0 para público
clan_channel_default_private = 0

# Invitaciones aceptadas mínimas para crear nuevo clan. 0 = los clanes serán creados
# sin necesidad de invitaciones aceptadas. Esto no afecta la gestión de clan
# en el juego WAR3/W3XP.
clan_min_invites = 2

###############################################################################
# registro de comandos de usuario                                            #
#-----------------------------------------------------------------------------#

# ¿Deberían los comandos de usuarios registrarse en archivos en el userlogdir?
log_commands = true

# Los comandos serán registrados para usuarios con estos grupos de comando
# (operadores globales y administradores están incluidos)
log_command_groups = 2345678

# Lista de comandos que serán registrados
# puede definirse conectándolos con una coma (,)
# establece vacío para registrar todos los comandos
log_command_list = ""

# IPC con MapServer
ipc_enabled = true
ipc_host = "127.0.0.1"
ipc_port = 7772

external_event_enabled = true
external_event_host = "127.0.0.1"
external_event_port = 7773