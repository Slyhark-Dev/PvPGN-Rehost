##############################################################################


##############################################################################
# Configuración Telnet                                                      #
#----------------------------------------------------------------------------#

# Esto especifica las direcciones donde deberían aceptarse conexiones telnet.
# Ver la descripción de servaddrs para información de formato. Deja este
