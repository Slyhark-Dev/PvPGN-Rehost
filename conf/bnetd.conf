##############################################################################
# bnetd.conf  -  Archivo de configuración para el daemon Unix Battle.net    #
#----------------------------------------------------------------------------#
#                                                                            #
# Este archivo es una configuración de ejemplo y puede requerir             #
# modificaciones para adaptarse a tus necesidades o sitio. Las líneas en    #
# blanco y las líneas que comienzan con "#" son ignoradas. Usa comillas     #
# alrededor de valores que contengan espacios.                              #
#                                                                            #
##############################################################################


##############################################################################
# Sección de almacenamiento                                                 #
# storage_path indicará a pvpgn cómo y desde dónde leer/escribir cuentas    #
# actualmente soporta 2 "drivers": file y sql                               #
#                                                                            #
# Sintaxis:                                                                  #
# * para driver de archivo plano:                                           #
#  storage_path = file:mode=plain;dir=<ruta_archivos_usuario>;clan=<ruta_archivos_clan>;team=<ruta_archivos_equipo>;default=/ruta/cuenta/predeterminada #
# * para driver de archivo cdb:                                             #
#  storage_path = file:mode=cdb;dir=<ruta_archivos_cdb>;clan=<ruta_archivos_clan>;team=<ruta_archivos_equipo>;default=/ruta/cuenta/predeterminada   #
# * para driver sql:                                                        #
#  storage_path = sql:variable=valor;...;default=0 (0 es el uid predeterminado)    #
#                                                                            #
# Variables para sql pueden ser:                                            #
# - "mode" : indica a PVPGN el modo sql que usarás (mysql/pgsql/etc..)      #
# - "host" : el host de la base de datos                                    #
# - "port" : el puerto TCP/IP si es necesario                               #
# - "socket" : el socket local UNIX si es necesario                         #
# - "name" : nombre de la base de datos                                     #
# - "user" : usuario de la bd                                               #
# - "pass" : contraseña de la bd                                            #
# - "default" : especifica el UID a usar para los datos de cuenta predeterminados #
# - "prefix" : prefijo a usar para todas las tablas pvpgn (predeterminado "") #
#                                                                            #
# Ejemplos:                                                                  #
# storage_path = file:mode=plain;dir=var\users;clan=var\clans;team=var\teams\;default=conf\bnetd_default_user.plain
# storage_path = file:mode=cdb;dir=var\userscdb;clan=var\clans;team=var\teams\;default=conf\bnetd_default_user.cdb
# storage_path = sql:mode=mysql;host=127.0.0.1;name=PVPGN;user=pvpgn;pass=pvpgnrocks;default=0;prefix=pvpgn_
# storage_path = sql:mode=pgsql;host=127.0.0.1;name=pvpgn;user=pvpgn;pass=pvpgnrocks;default=0;prefix=pvpgn_
# storage_path = sql:mode=sqlite3;name=var\users.db;default=0;prefix=pvpgn_
# storage_path = sql:mode=odbc;name=PVPGN;prefix=pvpgn_
#----------------------------------------------------------------------------#

storage_path = sql:mode=mysql;host=127.0.0.1;name=pvpgn;user=root;pass=amarracao;default=0;prefix=

#                                                                            #
##############################################################################

##############################################################################
# Sección de archivos                                                       #
# El pidfile puede establecerse en "" para desactivarlo.                    #
# ¡Usa rutas absolutas en estas líneas para evitar problemas!               #
#----------------------------------------------------------------------------#

filedir     = files
scriptdir   = lua
reportdir   = var\reports
chanlogdir  = var\chanlogs
userlogdir  = var\userlogs
i18ndir     = conf\i18n
issuefile   = conf\bnissue.txt
channelfile = conf\channel.conf
adfile      = conf\ad.json
topicfile   = conf\topics.conf
ipbanfile   = conf\bnban.conf
transfile   = conf\address_translation.conf
mpqfile     = conf\autoupdate.conf
logfile     = var\bnetd.log
realmfile   = conf\realm.conf
versioncheck_file = conf\versioncheck.json
mapsfile    = conf\bnmaps.conf
xplevelfile = conf\bnxplevel.conf
xpcalcfile  = conf\bnxpcalc.conf
#pidfile    = var\bnetd.pid
ladderdir    = var\ladders
command_groups_file = conf\command_groups.conf
statusdir   = var\status
aliasfile   = conf\bnalias.conf
anongame_infos_file = conf\anongame_infos.conf
DBlayoutfile = conf\sql_DB_layout.conf
supportfile = conf\supportfile.conf
customicons_file = conf\icons.conf


#                                                                            #
##############################################################################


##############################################################################
# Configuración de archivos localizados del servidor realm                  #
#----------------------------------------------------------------------------#

# Estos nombres de archivo pueden tener versiones traducidas en
# el directorio "i18n dir" especificado arriba.
# (también hay dos archivos descargables: chathelp-war3.txt, newaccount.txt)
localizefile = common.xml
motdfile    = bnmotd.txt
motdw3file  = w3motd.txt
newsfile    = news.txt
helpfile    = bnhelp.conf
tosfile     = termsofservice.txt

# ¿Localizar por idioma del juego o por país del usuario?
localize_by_country = true

#                                                                            #
##############################################################################


##############################################################################
# Registros de mensajes                                                     #
#----------------------------------------------------------------------------#

# Múltiples niveles de log pueden definirse conectándolos con una coma (,)
# Niveles de log disponibles son:
#   none    (ninguno)
#   trace   (rastro)
#   debug   (depuración)
#   info    (información)
#   warn    (advertencia)
#   error   (error)
#   fatal   (fatal)
#loglevels = fatal,error,warn,info,debug,trace
#loglevels = fatal,error,warn,info,debug
loglevels = fatal,error,warn,info,debug

#                                                                            #
##############################################################################


##############################################################################
# Configuración del servidor realm D2CS                                     #
#----------------------------------------------------------------------------#

# Versión del servidor D2CS para conectar (establecer en cero para deshabilitar verificación de versión)
d2cs_version = 0

# ¿Permitir al servidor D2CS cambiar nombres de realm?
allow_d2cs_setname = true

#                                                                            #
##############################################################################


##############################################################################
# Archivos descargables                                                     #
#----------------------------------------------------------------------------#

# Estos nombres de archivo se reportan directamente al cliente y son relativos al
# directorio "filedir" especificado arriba.
iconfile = "icons.bni"
war3_iconfile = "icons-WAR3.bni"
star_iconfile = "icons_STAR.bni"

#                                                                            #
##############################################################################


##############################################################################
# Verificación y actualizaciones de cliente                                 #
#----------------------------------------------------------------------------#

# Esta opción lista los tipos de cliente permitidos para conectar (solo válido para 
# el protocolo bnet y wol). La lista es una lista separada por comas de cualquiera de
# los siguientes elementos: 
# all  : todos los tipos de cliente permitidos (predeterminado)
# chat : tipo de cliente "CHAT" permitido (usado por algunos software de bot)
# dshr : tipo de cliente Diablo 1 Shareware
# drtl : tipo de cliente Diablo 1 (Retail)
# sshr : tipo de cliente Starcraft Shareware
# star : tipo de cliente Starcraft
# sexp : tipo de cliente Starcraft Broodwar
# w2bn : tipo de cliente Warcraft II Battle.Net Edition
# d2dv : tipo de cliente Diablo 2
# d2xp : tipo de cliente Diablo 2 LOD
# war3 : tipo de cliente Warcraft III (Reign Of Chaos)
# w3xp : tipo de cliente Warcraft III Frozen Throne
# tsun : tipo de cliente Tiberian Sun
# tsxp : tipo de cliente Tiberian Sun Firestorm
# ralt : tipo de cliente Red Alert (con parche de internet de 4 jugadores)
# ral2 : tipo de cliente Red Alert 2
# dn2k : tipo de cliente Dune 2000
# noxx : tipo de cliente Nox
# noxq : tipo de cliente Nox Quest
# rngd : tipo de cliente Renegade
# yuri : tipo de cliente Yuri's Revenge
# empr : tipo de cliente Emperor: Battle for Dune
#
# Ejemplo: allowed_clients = war3,w3xp
allowed_clients = all

# Si habilitas las verificaciones de versión pero quieres permitir clientes que no pasen
# la prueba de checksum entonces habilita esto.
allow_bad_version = false

# Si habilitas las verificaciones de versión pero quieres permitir clientes que no están
# listados en el archivo de configuración versioncheck entonces habilita esto. A menos que
# tengas un archivo muy completo o seas muy paranoico sobre tramposos esto
# es una buena idea.
allow_unknown_version = true

#                                                                            #
##############################################################################


##############################################################################
# Valores de tiempo                                                          #
#----------------------------------------------------------------------------#

# Tiempo en segundos entre actualizaciones de archivo de cuenta, 0 significa esperar para siempre.
usersync  = 300
# Número de segundos de inactividad antes de que el archivo sea descargado de la memoria.
# (solo verificado durante actualizaciones de archivo de cuenta)
userflush = 3600
# Número de usuarios verificados para actualizaciones a la vez. Valores más altos tienen sentido si
# tienes hardware muy rápido o no tienes muchas cuentas.
# Valores más bajos tienen sentido si tienes muy alto uso de CPU en el sistema donde ejecutas
# el servidor (no lo hagas muy bajo o tu sistema guardará cuentas continuamente).
# ¡Modifica este valor SOLO si sabes lo que estás haciendo!
userstep = 100
# ¿Limpiar usuarios conectados? Establece "false" y nunca serán limpiados hasta el logout (consumirá más memoria pero menos uso de CPU, debido a no hacer consultas a un archivo)
userflush_connected = true

# Qué tan frecuente enviar pruebas de latencia de usuario en segundos.
latency = 600

# Qué tan frecuente enviar paquetes null o keepalive en segundos.
nullmsg = 120

# Cantidad de tiempo para retrasar el apagado del servidor en segundos.
shutdown_delay = 300
# Cantidad de tiempo que el período de retraso se decrementa por una señal SIGTERM o SIGINT
# (control-c) en segundos.
shutdown_decr = 60

# ¿Qué tan frecuente deben verificarse los bans para expiración? (en segundos)
#ipban_check_int = 30

#                                                                            #
##############################################################################


##############################################################################
# Opciones de política                                                       #
#----------------------------------------------------------------------------#

# Si no quieres que la gente pueda crear nuevas cuentas, establece esto en
# false.
new_accounts = true

# Establece esto al número máximo de cuentas que quieres permitir que se
# creen en tu servidor. Un valor de 0 significa infinito y es el predeterminado.
#max_accounts = 0

# Si alguien intenta loguearse más de una vez, ¿debería expulsar el viejo
# login, o denegar el nuevo?
kick_old_login = true
#kick_old_login = false
# Sin contraseñas, esto es malo tenerlo habilitado --NonReal
        
# La opción load_new_account ha sido eliminada y la funcionalidad ahora está 
# siempre activa en PvPGN

# Si un usuario está creando un nuevo canal, ¿debería agregarse automáticamente, o
# preguntarles primero?
ask_new_channel = true

# ¿Debería escribirse un reporte de juego por cada juego jugado o solo juegos
# de escalera?
#report_all_games = false
report_all_games = true

# ¿Deberían escribirse reportes de Diablo I/II? No hay ganadores/perdedores.
report_diablo_games = false

# ¿Deberían ocultarse los juegos con contraseñas en la lista de juegos?
hide_pass_games = true

# ¿Deberían ocultarse los juegos ya iniciados en la lista de juegos? (para servidores
# muy cargados)
hide_started_games = true

# ¿Deberían ocultarse los canales no permanentes en la lista de canales?
hide_temp_channels = true

# ¿Deberían todas las desconexiones contarse como pérdidas?
# (¡Activar esto anulará la elección del usuario en juegos de escalera!)
disc_is_loss = false

# Lista tipos de juego adicionales para ser contados como juegos de escalera
# Tipos actualmente permitidos: topvbot, melee, ffa, oneonone
# Ejemplo: ladder_games = "topvbot,oneonone"
ladder_games = "none"

# Si tipos de juego adicionales están configurados (ver arriba) para ser contados como juegos
# de escalera entonces esta configuración configura un prefijo de nombre de juego para hacer que solo juegos
# que coincidan con este prefijo de nombre de juego sean contados como escalera. Esto permite
# tener juegos normales de los tipos de juego configurados con la directiva "ladder_games".
# Sin embargo, si esta configuración está comentada o "" entonces TODOS los juegos
# que coincidan con los tipos de juego configurados con "ladder_games" serán
# considerados como juegos de escalera. ¡La verificación de prefijo es SENSIBLE A MAYÚSCULAS!
# Ejemplo: ladder_prefix = "ldr_"
ladder_prefix = ""

# ¿Deberían todos los usuarios poder usar los comandos /con y /connections?
enable_conn_all = true

# ¿Deberían las direcciones IP del cliente (de /con, /games, /gameinfo, /netinfo)
# ocultarse de los no-administradores?
hide_addr = false

# ¿Deberían los mensajes de canal privado registrarse en archivos en el directorio
# chanlogdir? (ver channels.list para canales públicos)
chanlog = false

# ¿Quieres usar la característica de cuota de canal?
quota = yes

# Las siguientes opciones tratan con prevención de flood.
#
# ¿Cuántas líneas aceptas en quota_time segundos?
# (El predeterminado debería permitir 5 líneas en 5 segundos,
# períodos de tiempo más largos permiten "ráfagas" de tráfico antes de que la cuota esté llena.)
quota_lines = 50     # debe estar entre 1 y 100 líneas
quota_time = 5      # debe estar entre 1 y 60 segundos
# "envolvimiento virtual", por lo que líneas largas cuentan como múltiples líneas
quota_wrapline = 40 # debe estar entre 1 a 256 caracteres
# máximo absoluto de caracteres permitidos en una línea
quota_maxline = 200 # debe estar entre 1 a 256 caracteres
#
# ¿Cuántas líneas aceptas en quota_time segundos antes de que el usuario sea
# desconectado?
# (Según Jung-woo, Dobae es un término coreano para hacer flood al servidor de juego...
# originalmente significaba "pintar el papel tapiz en una casa nueva o renovada").
# Si es menor o igual a quota_lines, no hay advertencia antes de
# desconexión así que no establezcas esto muy bajo.
quota_dobae = 100     # debe estar entre 1 y 100 líneas

# Soporte de correo
mail_support = true
mail_quota = 5

# Mensaje de registro de canal
log_notice = "*** ¡Por favor nota que este canal está registrado! ***"

# Ban por fallos repetidos de contraseña contra ladrones de contraseñas de fuerza bruta
# Fallos requeridos para obtener IP baneada (0 para deshabilitar ban por fallo de contraseña)
passfail_count = 0

# Duración del ban de IP por fallo de contraseña (en segundos)
passfail_bantime = 300

# Límite máximo de usuarios en canales privados (0 = ilimitado)
maxusers_per_channel = 0

#                                                                            #
##############################################################################


##############################################################################
# Configuración de cuenta                                                   #
#----------------------------------------------------------------------------#

# ¿Deberían nombrarse los archivos de cuenta por el número de cuenta o el nombre del jugador?
savebyname = true

# Guardar los datos de cuenta al desconectarse
sync_on_logoff = false

# ¿Cuántas filas debería tener la tabla hash de búsqueda de cuenta? Servidores con
# más cuentas deberían usar una tabla más grande para mejor rendimiento.
hashtable_size = 61

# Por defecto, solo símbolos alfanuméricos están permitidos en nombres de cuenta
# con esta variable puedes agregar algunos símbolos extra para ser permitidos
# pero ten cuidado - algunos de ellos podrían causar problemas - al menos con
# savebyname=true (algunos símbolos están prohibidos en nombres de archivo o podrían causarte
# problemas reales - por favor no permitas símbolos comodín como '*' o '?'.
# Delimitadores de ruta como '/' o '\' están filtrados por código duro y no pueden ser permitidos.
# También nota que permitir el '.' podría causarte dolor de cabeza en sistemas win32.
# Has sido advertido - el resto depende de ti.
# configuración predeterminada es "-_[]" como era en versiones anteriores
account_allowed_symbols = "-_[]"

# Esta configuración afecta usuarios que se loguean con su uid en lugar de su
# nombre de usuario. Si se establece en true su nombre de usuario mostrado será forzosamente
# convertido a su nombre de cuenta registrado.
account_force_username = false

# número máximo de amigos que un usuario puede agregar a su lista de amigos
# configuración predeterminada es 20
max_friends = 20

#                                                                            #
##############################################################################


##############################################################################
# Información del servidor de rastreo                                       #
#----------------------------------------------------------------------------#

# Establece track=0 para deshabilitar rastreo. Cualquier otro número establecerá número
# de segundos entre envío de paquetes de rastreo. Esto está ACTIVADO por defecto.
track = 0
#track = 60

# Servidor(es) de rastreo
# Usa una lista delimitada por comas de nombres de host con números de puerto UDP opcionales
# después de dos puntos. (puerto 6114 es el predeterminado para el protocolo de rastreo más nuevo)
trackaddrs = "track.pvpgn.org,bntrack.darkwings.org,bnet.mivabe.nl,track.eurobattle.net"

# Cambia estos para que coincidan con tu sistema, por ejemplo:
location = "unknown"
description = "unknown"
url = "https://github.com/pvpgn/pvpgn-server"
contact_name = "a PvPGN user"
contact_email = "unknown"

#                                                                            #
##############################################################################


##############################################################################
# Información de red del servidor                                           #
#----------------------------------------------------------------------------#

# Nombre del servidor por el cual el servidor se identifica (predeterminado: "PvPGN Realm")
servername = "PvPGN-Realm"

# Establece esto al número máximo de conexiones concurrentes permitidas en 
# este servidor (mínimo 32). Este límite establece un límite de conexión general del servidor,
# NO el límite de usuario concurrente (para eso ver siguiente opción)
max_connections = 1000

# Establece cantidad máxima de paquetes en cola de paquetes de cliente
# Si se alcanza el límite, la conexión del cliente será eliminada
# Establece en 0 para deshabilitar
packet_limit = 5000

# Número máximo de usuarios concurrentes (0 significa ilimitado).
max_concurrent_logins = 0

# Establece esta opción en true para permitir a TCP detectar y cerrar conexiones
# obsoletas.
use_keepalive = true

# Limitar número máximo de conexiones por IP (0 = ilimitado)
# esta característica es nueva, así que no hay valor recomendado hasta ahora
# (las conexiones d2cs están exentas de esta limitación)
max_conns_per_IP = 50

# Esta es una lista delimitada por comas de nombres de host en los que el servidor debería
# escuchar. Podría ser útil hacer un servidor solo interno en una
# máquina gateway por ejemplo. Si la lista no está establecida o si tiene una
# entrada sin componente de host, el servidor se vinculará a ese puerto en todas
# las interfaces.
#servaddrs = ":9999"
#servaddrs = "myinternalname.some.com,localhost"
servaddrs = ":" # interfaz predeterminada (todas) y puerto predeterminado (6112)

# ¡No cambies estos a menos que realmente necesites hacerlo! Necesitarás ejecutar un proxy
# o modificar los clientes. También nota que estos no cambiarán cuando simplemente
# envíes una señal HUP al servidor; solo se leen al inicio.

# Este es el puerto al que el servidor envía los paquetes de prueba UDP por defecto.
# Establecerlo en cero hace que el servidor use el mismo puerto del que viene la conexión TCP.
# Los clientes más nuevos pueden anular esta configuración en base a cada conexión.
#udptest_port = 6112


# Dirección del router W3 Play Game. Solo pon tu dirección del servidor aquí
# o usa 0.0.0.0:6200 para que el servidor se vincule a todas las interfaces,
# pero asegúrate de configurar w3trans si lo haces.
w3routeaddr = "0.0.0.0:6200"

# w3routeshow ha sido removido.
# ver el address_translation.conf para traducir la ip w3route para redes locales

# initkill_timer establece un temporizador periódico en conexiones de clase init/defer
# esto debería detectar y limpiar conexiones obsoletas a tu servidor
initkill_timer = 120

#                                                                            #
##############################################################################

##############################################################################
# Configuración Westwood Online (WOL)                                       #
#----------------------------------------------------------------------------#

# NOTA: ¡El soporte WOL aún es experimental!

# Esto especifica las direcciones donde deberían aceptarse conexiones WOL. Ver
# la descripción de servaddrs para información de formato. Deja este campo
# en blanco si no quieres aceptar conexiones WOL. Si el puerto wolv1 no está
# especificado entonces se usará 4005. También si el puerto wolv2 no está especificado
# entonces se usará 4000.
# La dirección WOLv2 incluye servserv, servicios de juego/chat y escalera.
#
# Nota: ¡NO ESTABLEZCAS EL PUERTO A NADA DIFERENTE A 4000 para WOLv1 o 4005 para
# WOLv2, WOL FALLARÁ SI LO HACES!

#wolv1addrs = ":4000"
#wolv2addrs = ":4005"
#wgameresaddrs = ":4807"
#apiregaddrs = ":5400"

# Solo deja estos como predeterminado (a menos que conozcas la zona horaria, longitud y latitud
# de tu servidor
woltimezone = "-8"
wollongitude = "36.1083"
wollatitude = "-115.0582"

# Estos como predeterminado significa que la actualización automática WOL usará el servidor FTP oficial WOL.
# Como "wol_update_serverhost" también puede usarse una dirección IP. El servidor FTP no es
# componente de PvPGN así que para ese propósito puede usarse cualquier servidor FTP.
# Nota que el nombre de usuario y contraseña es especificable solo en el protocolo WOLv2. WOLv1
# siempre usará los valores predeterminados.
wol_autoupdate_serverhost = "westwood-patch.ea.com"
wol_autoupdate_username = "update"
wol_autoupdate_password = "world96"

#                                                                            #
##############################################################################

##############################################################################
# Configuración Internet Relay Chat (IRC)                                   #
#----------------------------------------------------------------------------#

# NOTA: ¡El soporte IRC aún es experimental!

# Esto especifica las direcciones donde deberían aceptarse conexiones IRC. Ver
# la descripción de servaddrs para información de formato. Deja este campo
# en blanco si no quieres aceptar conexiones IRC. Si el puerto no está
# especificado entonces se usará 6667.
